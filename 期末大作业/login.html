<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 25级的网店</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #fafdfc;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #d6dbda;
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 48px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .logo {
            font-size: 26px;
            font-weight: 700;
            color: #345eb1;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .logo em {
            font-style: normal;
            color: #345eb1;
        }

        .login-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            padding: 48px 40px 36px;
            width: 400px;
            max-width: 100%;
        }
        .login-box h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-box p {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .login-box .field {
            margin-bottom: 20px;
        }
        .login-box .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .login-box .field input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .login-box .field input:focus {
            border-color: #aaa;
            background: #fff;
        }

        .login-box .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #345eb1;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box .submit-btn:hover {
            background: #2a4d94;
        }

        .login-box .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .login-box .links a {
            color: #888;
            text-decoration: none;
        }
        .login-box .links a:hover {
            color: #345eb1;
        }
        .login-box .links .sep {
            color: #d8d8d8;
            margin: 0 12px;
        }

        .login-box .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }
        .login-box .back-link:hover {
            color: #345eb1;
        }

        footer {
            background: #eceeed;
            padding: 20px 32px;
            text-align: center;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <header>
        <a href="1.html" class="logo">25<em>级</em>的网店</a>
    </header>

    <div class="login-wrap">
        <div class="login-box">
            <h1>登录</h1>
            <form action="1.html" method="get">
                <div class="field">
                    <label>用户名 / 邮箱</label>
                    <input type="text" type="email" name="user" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" name="pass" placeholder="请输入密码" required minlength="6">
                </div>
                <button type="submit" class="submit-btn">登 录</button>
            </form>
            <div class="links">
                <a href="#">忘记密码</a>
                <span class="sep">|</span>
                <a href="1.html#register">立即注册</a>
            </div>
            <a href="1.html" class="back-link">← 返回首页</a>
        </div>
    </div>

    <footer>
        © 2026 25级的网店 · 保留所有权利
    </footer>
</body>
</html>
