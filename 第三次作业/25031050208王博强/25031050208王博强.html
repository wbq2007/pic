<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格表单</title>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                #2c3e50,
                #4a5568,
                #6b4f7c,
                #7c5c52);
            padding: 30px;
        }
        .container {
            width: 60%;
            height: 600px;
            margin: 0 auto;
            background: linear-gradient(120deg,
                #e0f7fa,
                #e8f5fc,
                #fef5f7,
                #fff8e8);
            border-radius: 10px;
        }
        .left {
            width: 35%;
            height: 95%;
            margin: 10px;
            float: left;
            background-color: #4060a0;
            border-radius: 10px;
        }
        .right {
            width: 60%;
            height: 95%;
            margin: 10px;
            float: right;
            background-color: white;
        }
        h2 {
            padding-left: 2.5%;
        }
        form div {
            margin: 15px 0;
        }
        button[type="submit"]{
            background-color: #5b79c7;
            border-radius: 5px;
            border: none;
            padding: 10px 20px;
        }
        button[type="reset"]{
            background-color: #c75b5b;
            border-radius: 5px;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h2>表格</h2>
            <table border="1" cellspacing="5" cellpadding="8" align="center" width="95%">
                <tr>
                    <th>姓名</th>
                    <th>班级</th>
                    <th>分数</th>
                </tr>
                <tr>
                    <td>张三</td>
                    <td>一班</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>李四</td>
                    <td>二班</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>王五</td>
                    <td>三班</td>
                    <td>88</td>
                </tr>
            </table>
        </div>
        <div class="right">
            <h2>表单</h2>
            <form style="padding-left: 2.5%">
                <div>
                    用户名：<input type="text" name="username">
                </div>
                <div>
                    电子邮件：<input type="email" name="email">
                </div>
                <div>
                    密码：<input type="password" name="password">
                </div>
                <div>
                    年龄：<input type="number" name="age">
                </div>
                <div>
                    性别：
                    <input type="radio" name="sex" value="male"> 男
                    <input type="radio" name="sex" value="female"> 女
                </div>
                <div>
                    兴趣：
                    <input type="checkbox" name="hobby" value="sing"> 唱歌
                    <input type="checkbox" name="hobby" value="dance"> 跳舞
                    <input type="checkbox" name="hobby" value="swim"> 游泳
                </div>
                <div>
                    地址：
                    <select>
                        <optgroup label="北京">
                            <option value="dongcheng" selected>东城区</option>
                            <option value="xicheng">西城区</option>
                            <option value="chaoyang">朝阳区</option>
                            <option value="haidian">海淀区</option>
                        </optgroup>
                        <optgroup label="上海">
                            <option value="pudong">浦东新区</option>
                            <option value="xuhui">徐汇区</option>
                            <option value="hongkou">虹口区</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <button type="submit">提交</button>
                    <button type="reset">重置</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
