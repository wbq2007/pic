<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格表单</title>
    <style>
        .container {
            width: 60%;
            height: 600px;
            margin: 0 auto;
            background-color: #0ff;
        }
        .left {
            width: 35%;
            height: 95%;
            margin: 10px;
            float: left;
            background-color:silver;
        }
        .right {
            width: 60%;
            height: 95%;
            margin: 10px;
            float: right;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
                <h2>表格</h2>
                <table border="1" cellspacing="0" cellpadding="5">
                    <tr>
                        <th>姓名</th>
                        <th>年龄</th>
                        <th>性别</th>
                    </tr>
                    <tr>
                        <td>张三</td>
                        <td>25</td>
                        <td>男</td>
                    </tr>
                    <tr>
                        <td>李四</td>
                        <td>30</td>
                        <td>女</td>
                    </tr>
        </div>
        <div class="right">
                <h2>表单</h2>
                <p>这是右侧的内容区域，可以放置一些文本、图片或其他元素。</p>
        </div>
</body>
</html>
