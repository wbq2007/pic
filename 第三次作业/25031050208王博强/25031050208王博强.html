<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格表单</title>
    <style>
        .container {
            width: 60%;
            height: 600px;
            margin: 0 auto;
            background-color: #0ff;
        }
        .left {
            width: 35%;
            height: 95%;
            margin: 10px;
            float: left;
            background-color:silver;
        }
        .right {
            width: 60%;
            height: 95%;
            margin: 10px;
            float: right;
            background-color: white;
        }
        h2 {
            padding-left: 2.5%;
        }
        #left {
            width: 95%;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 2px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
                <h2>表格</h2>
                <table id="left">
                    <tr>
                        <th>姓名</th>
                        <th>班级</th>
                        <th>分数</th>
                    </tr>
                    <tr>
                        <td>张三</td>
                        <td>一班</td>
                        <td>85</td>
                    </tr>
                    <tr>
                        <td>李四</td>
                        <td>二班</td>
                        <td>90</td>
                    </tr>
                    <tr>
                        <td>王五</td>
                        <td>三班</td>
                        <td>88</td>
                    </tr>
                </table>
        </div>
        <div class="right">
                <h2>表单</h2>
                <form>
                    <label for="name">姓名:</label><br>
                    <input type="text" id="name" name="name"><br><br>
                    <label for="class">班级:</label><br>
                    <input type="text" id="class" name="class"><br><br>
                    <label for="score">分数:</label><br>
                    <input type="text" id="score" name="score"><br><br>
                    <input type="submit" value="提交">
                </form>
        </div>
</body>
</html>
