<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单复刻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 16px;
        }
        body {
            padding: 20px;
            background-color: #f5f5f5;
        }
        .form-container {
            background-color: white;
            padding: 15px;
            border-left: 3px solid #00e0e0;
            border-bottom: 3px solid #00e0e0;
        }
        .form-item {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .form-label {
            width: 50px;
            text-align: right;
            margin-right: 8px;
        }
        .input-box {
            width: 120px;
            padding: 4px 6px;
            border: 1px solid #999;
            margin-bottom: 12px;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
        }
        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        input[type="radio"], input[type="checkbox"] {
            accent-color: #0066cc;
            transform: scale(1.1);
        }
        select {
            padding: 4px 6px;
            border: 1px solid #999;
            min-width: 120px;
            cursor: pointer;
        }
        option {
            padding: 2px;
        }
        optgroup {
            font-weight: bold;
            color: black;
        }
        optgroup option {
            font-weight: normal;
            padding-left: 15px;
        }
        .submit-btn {
            padding: 4px 16px;
            border: 1px solid #999;
            background-color: #f0f0f0;
            cursor: pointer;
            margin-right: 8px;
        }
        .submit-btn:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- 左上角数字输入框 -->
        <input type="text" class="input-box" value="90" readonly>

        <!-- 性别单选框 -->
        <div class="form-item">
            <label class="form-label">性别：</label>
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="gender" value="male" checked>
                    男
                </label>
                <label class="radio-item">
                    <input type="radio" name="gender" value="female">
                    女
                </label>
            </div>
        </div>

        <!-- 兴趣复选框 -->
        <div class="form-item">
            <label class="form-label">兴趣：</label>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" name="hobby" value="sing" checked>
                    唱歌
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="hobby" value="dance" checked>
                    跳舞
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="hobby" value="swim" checked>
                    游泳
                </label>
            </div>
        </div>

        <!-- 地址下拉框 -->
        <div class="form-item">
            <label class="form-label">地址：</label>
            <select class="select-box">
                <optgroup label="北京">
                    <option value="dongcheng" selected>东城区</option>
                    <option value="xicheng">西城区</option>
                    <option value="chaoyang">朝阳区</option>
                    <option value="haidian">海淀区</option>
                </optgroup>
                <optgroup label="上海">
                    <option value="pudong">浦东新区</option>
                    <option value="xuhui">徐汇区</option>
                    <option value="hongkou">虹口区</option>
                </optgroup>
            </select>
        </div>

        <!-- 提交按钮 -->
        <button class="submit-btn">提交</button>
    </div>
</body>
</html>
